        .selling-points h4 { margin-top: 0; color: #10b981; }

        .tags-container { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
        
        /* Normalized Tag Styles */
        .tag {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            cursor: help;
            font-weight: 600;
            border: 1px solid #444;
            display: inline-block;
            transition: background 0.2s, border-color 0.2s;
        }
        .tag:hover { background: #444; border-color: #666; }
        .tag--job { background: #4d4400; color: #ffeb3b; border-color: #ffd600; } /* Yellow: Job only */
        .tag--history { background: #002b4d; color: #4fc3f7; border-color: #03a9f4; } /* Blue: Experience only */
        .tag--both { background: #0a3d1d; color: #81c784; border-color: #4caf50; } /* Green: Both */

        .descriptor {
            font-size: 0.7rem;
            color: #888;
            background: #111;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            border: 1px solid #333;
            display: inline-block;
        }

        .legend-item { display: flex; align-items: center; gap: 0.5rem; }

        /* Tooltip Styles */
        .tag-tooltip {
            position: absolute;
            background: #252525;
            color: #fff;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #5b9bd5;

            z-index: 1000;
            max-width: 250px;
            pointer-events: none;
            display: none;
            font-size: 0.85rem;
        }

        .tag-tooltip .relation-label { color: #888; font-size: 0.7rem; text-transform: uppercase; margin-top: 0.5rem; display: block; }
        .tag-tooltip .relation-item { 
            display: inline-block; 
            background: #333; 
            padding: 0.1rem 0.4rem; 
            border-radius: 3px; 
            font-size: 0.75rem; 
            margin-right: 0.3rem;

            border: 1px solid #444;

        .tag-parent { min-width: 150px; font-family: monospace; }
        .tag-arrow { margin: 0 1rem; color: #666; }
        .tag-children { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    </style>
</head>

        function getTagClass(tagName, jobTags = []) {
            const inExperience = userExpertise.has(tagName);
            const inJob = jobTags.includes(tagName);
            
            if (inExperience && inJob) return 'tag--both'; // Green
            if (inExperience) return 'tag--history'; // Blue
            if (inJob) return 'tag--job'; // Yellow
            return ''; 
        }

        function getRelativeTime(isoString) {
            const posted = new Date(isoString);
            const now = new Date();
            const diffDays = Math.floor((now - posted) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return "Today";
            if (diffDays === 1) return "1d ago";
            if (diffDays < 7) return `${diffDays}d ago`;
            if (diffDays < 30) { const weeks = Math.floor(diffDays / 7); return `${weeks}w ago`; }
            return `${Math.floor(diffDays / 30)}mo ago`;
        }

        function renderJobs() {

                const scoreCard = document.createElement('div');
                scoreCard.className = 'job-card';
                scoreCard.innerHTML = `
                    <div class="job-header">
                        <div>
                            <div class="job-title">${job.title}</div>
                            <div class="company">${job.company}</div>
                            <div class="metadata">
                                <span>📅 ${getRelativeTime(job.postedAt)}</span>
                                <span>🏢 ${job.stage}</span>
                            </div>
                        </div>
                        <div class="score-pill">Fit: ${job.score}%</div>
                    </div>
                    <p><em>${job.mission}</em></p>
                    <div class="tags-container">
                        ${job.tags.map(t => `<span class="tag ${getTagClass(t, job.tags)}" onmouseenter="showTooltip(event, '${t}')" onmouseleave="hideTooltip()">${t}</span>`).join('')}
                    </div>
                    <div class="score-row">
                        <div class="score-factor"><div class="factor-label">Seniority</div><div class="factor-value">${job.breakdown.seniority || job.breakdown.influence}%</div></div>
                        <div class="score-factor"><div class="factor-label">Low-Level</div><div class="factor-value">${job.breakdown.lowLevel || job.breakdown.techStack}%</div></div>
                        <div class="score-factor"><div class="factor-label">Domain</div><div class="factor-value">${job.breakdown.domain}%</div></div>
                        <div class="score-factor"><div class="factor-label">Zero-to-One</div><div class="factor-value">${job.breakdown.zeroToOne || 85}%</div></div>
                    </div>
                    <div class="selling-points">
                        <h4>Key Selling Points</h4>
                        <ul>${job.sellingPoints.map(p => `<li>${p}</li>`).join('')}</ul>
                    </div>
                `;
                scoresContainer.appendChild(scoreCard);

                const linkCard = document.createElement('div');
                linkCard.className = 'job-card';

                        <a href="${job.url}" target="_blank">${job.url}</a>
                    </div>
                `;

        }

        function renderTags() {
            const container = document.getElementById('tags-container-audit');
            container.innerHTML = '';

            // Helper to see if a tag is used in any job (to support Yellow/Green in audit)
            const allJobTags = Array.from(new Set(jobData.flatMap(j => j.tags)));

            Object.keys(tagDefinitions).forEach(cat => {
                if (!tagDefinitions[cat].children) return; 

                const group = document.createElement('div');
                group.className = 'tag-audit-group';
                group.innerHTML = `
                    <div class="tag-audit-header">${cat}</div>
                    <p><small>${tagDefinitions[cat].description}</small></p>
                    ${tagDefinitions[cat].children.map(child => {
                        const childData = tagDefinitions[child] || {};
                        
                        const subContent = childData.children 
                            ? childData.children.map(grand => `<span class="tag ${getTagClass(grand, allJobTags)}" onmouseenter="showTooltip(event, '${grand}')" onmouseleave="hideTooltip()">${grand}</span>`).join('')
                            : (childData.details ? childData.details.map(d => `<span class="descriptor">${d}</span>`).join('') : '<span class="descriptor">Implementation Detail</span>');

                        return `
                        <div class="tag-relation">
                            <div class="tag tag-parent ${getTagClass(child, allJobTags)}" onmouseenter="showTooltip(event, '${child}')" onmouseleave="hideTooltip()">${child}</div>
                            <div class="tag-arrow">→</div>
                            <div class="tag-children">
                                ${subContent}
                            </div>
                        </div>
                        `;
                    }).join('')}
                `;
                container.appendChild(group);
            });
        }

        function showTooltip(event, tagName) {
            const tooltip = document.getElementById('tag-tooltip');
            const tagData = tagDefinitions[tagName];
            let content = `<h5>${tagName}</h5>`;
            
            // Explicit Category/Parent Finder
            const findAllCategories = (name) => {
                const parents = Object.keys(tagDefinitions).filter(k => tagDefinitions[k].children && tagDefinitions[k].children.includes(name));
                return parents.length > 0 ? parents : null;
            };

            const categories = findAllCategories(tagName);
            if (categories) {
                content += `<span class="relation-label">Categories:</span>${categories.map(c => `<span class="relation-item">${c}</span>`).join('')}`;
            }

            const inExperience = userExpertise.has(tagName);
            const status = inExperience ? "Matched to Experience" : "Job Requirement (Gap)";
            content += `<span class="relation-label">Status:</span><span class="relation-item">${status}</span>`;

            if (tagData) {
                content += `<p>${tagData.description || 'Specialized expertise in this technical domain.'}</p>`;
                if (tagData.children) {
                    content += `<span class="relation-label">Sub-Specializations:</span>`;
                    tagData.children.forEach(c => { content += `<span class="relation-item">${c}</span>`; });
                } else if (tagData.details) {
                    content += `<span class="relation-label">Includes:</span>`;
                    tagData.details.forEach(d => { content += `<span class="relation-item">${d}</span>`; });
                }
            } else {
                content += `<p>Core technical detail.</p>`;
            }

            tooltip.innerHTML = content;
            tooltip.style.display = 'block';
            const rect = event.target.getBoundingClientRect();
            tooltip.style.left = `${rect.left + window.scrollX}px`;
            tooltip.style.top = `${rect.bottom + window.scrollY + 10}px`;
        }

        function hideTooltip() { document.getElementById('tag-tooltip').style.display = 'none'; }

        window.showTab = function(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const tabs = document.querySelectorAll('.tab');
            if (tabId === 'scores') tabs[0].classList.add('active');
            else if (tabId === 'links') tabs[1].classList.add('active');
            else tabs[2].classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
            if (tabId === 'tags') renderTags();
        }

        renderJobs();
    </script>
</body>
</html>
